name: Build GenieX Android App

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 安装官方要求的 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. 安装 Android SDK 命令行工具（不依赖有问题的 setup-android 插件）
      - name: Setup Android SDK Command-line Tools
        run: |
          echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin:$HOME/Android/Sdk/platform-tools" >> $GITHUB_ENV
          mkdir -p $HOME/Android/Sdk/cmdline-tools
          cd $HOME/Android/Sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

      # 3. 安装 Gradle 8.7（避开 GitHub 默认 9.6.0 的兼容性问题）
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 4. 构建 APK
      - name: Grant execute permission for gradlew
        working-directory: ./geniex_chat_android
        run: |
          if [ ! -f gradlew ]; then
            echo "未找到 gradlew，使用 Gradle 8.7 生成..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./geniex_chat_android
        run: ./gradlew assembleDebug --no-daemon

      # 5. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geniex-debug-apk
          path: geniex_chat_android/app/build/outputs/apk/debug/*.apk
