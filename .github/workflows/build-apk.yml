name: Build GenieX Android App

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4  # 修复：从 v3 升级到 v4
        with:
          packages: |
            build-tools;34.0.0
            platforms;android-34

      - name: Grant execute permission for gradlew
        run: chmod +x geniex_chat_android/gradlew

      - name: Build Debug APK
        working-directory: ./geniex_chat_android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geniex-debug-apk
          path: geniex_chat_android/app/build/outputs/apk/debug/*.apk
