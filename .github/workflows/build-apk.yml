name: Build GenieX Android App

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Grant execute permission for gradlew
        working-directory: ./geniex_chat_android
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.13; fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./geniex_chat_android
        run: ./gradlew assembleDebug --no-daemon

      # 新增：专门用来侦察 APK 文件到底生成在哪里
      - name: Check APK Location
        working-directory: ./geniex_chat_android
        run: find . -name "*.apk" -type f

      # 上传路径使用通配符，一旦找到就自动上传
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geniex-debug-apk
          path: geniex_chat_android/**/*.apk
