name: Build GenieX Android App

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 删除出错的 setup-android 插件，直接用系统预装的 SDK 环境

      - name: Grant execute permission for gradlew
        working-directory: ./geniex_chat_android
        run: |
          if [ ! -f gradlew ]; then gradle wrapper; fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./geniex_chat_android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geniex-debug-apk
          path: geniex_chat_android/app/build/outputs/apk/debug/*.apk
