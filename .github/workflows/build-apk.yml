name: Build GenieX Android App

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 安装 AGP 8.13.0 所要求的 Gradle 8.13
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Grant execute permission for gradlew
        working-directory: ./geniex_chat_android
        run: |
          if [ ! -f gradlew ]; then
            echo "未找到 gradlew，使用 Gradle 8.13 生成..."
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./geniex_chat_android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geniex-debug-apk
          path: geniex_chat_android/app/build/outputs/apk/debug/*.apk
